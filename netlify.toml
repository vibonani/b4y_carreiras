[build]
  command = "npm run build"
  publish = "dist"

# Proxies /api/* to the backend (server.js) hosted separately (e.g. Render),
# so the frontend keeps calling relative "/api/..." paths unchanged and the
# browser only ever talks to this Netlify domain (no CORS setup needed).
# Replace the URL below with your actual Render backend URL.
[[redirects]]
  from = "/api/*"
  to = "https://b4y-carreiras.onrender.com/api/:splat"
  status = 200
  force = true
